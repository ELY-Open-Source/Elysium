services:
  elysian:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./.elysian:/data/elysian
    environment:
      ELYSIAN_HOME: /data/elysian
      ELYSIAN_RUNTIME_BACKEND: sglang
      ELYSIAN_SGLANG_BASE_URL: http://host.docker.internal:8000/v1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
