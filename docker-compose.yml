services:
  elysium:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./.elysium:/data/elysium
    environment:
      ELYSIUM_HOME: /data/elysium
      ELYSIUM_RUNTIME_BACKEND: sglang
      ELYSIUM_SGLANG_BASE_URL: http://host.docker.internal:8000/v1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
