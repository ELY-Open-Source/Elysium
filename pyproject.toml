[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "."
python_version = "3.12"
files = ["bench", "backend/src"]
# bench/corpus is downloaded third-party data (git clones), not our source.
exclude = "bench/corpus/"

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rapidocr_onnxruntime.*",
    "cv2.*",
    "rank_bm25",
    "sentence_transformers.*",
    "onnxruntime.*",
    "faster_whisper.*",
]
ignore_missing_imports = true
