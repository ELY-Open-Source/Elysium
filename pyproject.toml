[tool.pytest.ini_options]
# bench/tests imports the bench package by name, so the repo root must be importable
# whichever way pytest is launched (pytest, or python -m pytest).
pythonpath = ["."]
testpaths = ["backend/tests", "bench/tests"]

[tool.mypy]
python_executable = ".venv/bin/python"
mypy_path = "."
python_version = "3.12"
files = ["bench", "backend/src"]
# bench/corpus is downloaded third-party data (git clones), not our source.
exclude = "bench/corpus/"

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rapidocr_onnxruntime.*",
    "cv2.*",
    "rank_bm25",
    "sentence_transformers.*",
    "onnxruntime.*",
    "faster_whisper.*",
    "sqlite_vec",
]
ignore_missing_imports = true
